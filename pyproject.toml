[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gears-ev"
version = "2.0.0"
description = "Generating Electric vehicle recharging Sessions – simulation, forecasting and smart charging"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yvenn Amara-Ouali"}]
requires-python = ">=3.10"
keywords = ["electric vehicles", "EV", "simulation", "GMM", "smart charging", "forecasting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pmdarima>=2.0",
    "holidays>=0.46",
    "requests>=2.31",
    "click>=8.0",
]

[project.optional-dependencies]
dl = ["neuralforecast>=2.0", "torch>=2.0"]
vae = ["torch>=2.0"]
hub = ["huggingface-hub>=0.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pyarrow>=15.0",
    "torch>=2.0",
]
all = ["gears-ev[dl,vae,hub,dev]"]

[project.scripts]
gears = "gears.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gears*"]

[tool.setuptools.package-data]
"gears.data.session_models" = ["*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
