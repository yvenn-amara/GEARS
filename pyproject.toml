[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gears-ev"
version = "2.0.0"
description = "Generating Electric vehicle recharging Sessions – simulation, forecasting and smart charging"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yvenn Amara-Ouali"}]
requires-python = ">=3.10"
keywords = ["electric vehicles", "EV", "simulation", "GMM", "smart charging", "forecasting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pmdarima>=2.0",
    "holidays>=0.46",
    "click>=8.0",
]

[project.optional-dependencies]
dl = ["neuralforecast>=2.0", "torch>=2.0"]
vae = ["torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pyarrow>=15.0",
    "torch>=2.0",
]
all = ["gears-ev[dl,vae,dev]"]

[project.scripts]
gears = "gears.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gears*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` runs everything except the markers below; `pytest -m vae` / `pytest -m dl`
# select one family explicitly (the last -m on the command line wins).
addopts = "-ra --strict-markers --strict-config -m 'not dl and not slow'"
markers = [
    "vae: needs torch (pip install 'gears-ev[vae]'); skipped when torch is absent",
    "dl: needs torch and neuralforecast (pip install 'gears-ev[dl]'); heavy, run on demand or weekly",
    "slow: takes more than a few seconds; excluded from the default run",
]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["gears"]
branch = true
# The code that needs torch / neuralforecast cannot be measured by the core job, which
# runs without them; the extras jobs exercise it (pytest -m vae, pytest -m dl).
omit = ["gears/models/vae.py", "gears/models/forecaster_dl.py"]

[tool.coverage.report]
# Measured without torch: 91 % (branch coverage). The floor is the measure minus 2 points, so
# that noise does not break the build but a real drop does; raise it when coverage improves.
fail_under = 89
show_missing = true
skip_covered = true
