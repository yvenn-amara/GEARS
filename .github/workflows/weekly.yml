name: Weekly

# What is too heavy or too remote for every pull request: the deep-learning forecasters
# (neuralforecast), and the download of the real French model from the GitHub release.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dl:
    name: dl (neuralforecast, pytest -m dl)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install GEARS with the dl extra
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,dl]"
      - name: Deep-learning forecaster tests
        run: pytest -m dl

  # load_pretrained("french") against the real release: download, SHA-256 check, load.
  # It only runs on EDF-Lab/GEARS: a release of a private repository cannot be downloaded
  # without a token, so on the former repository this job would only ever fail.
  pretrained:
    name: pretrained (download the French model)
    if: github.repository == 'EDF-Lab/GEARS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GEARS
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Download and load the French model
        env:
          GEARS_HOME: ${{ runner.temp }}/gears-home
        run: python -c "from gears import load_pretrained; print(load_pretrained('french'))"
