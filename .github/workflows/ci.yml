name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The default test run, without torch: lint, then the whole suite (examples and README
  # blocks included) with branch coverage, which fails below the floor set in pyproject.toml.
  core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install GEARS and the dev tools (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check gears tests examples
          vulture
      - name: Tests
        run: pytest --cov

  # The VAE tests, which need torch (the CPU wheel: no CUDA download on a runner without GPU).
  extras:
    name: extras (torch, pytest -m vae)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install GEARS with the vae extra
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,vae]"
      - name: VAE tests
        run: pytest -m vae

  # The lower bounds of the dependencies in pyproject.toml must be true: install every one at its
  # minimum (numpy 1.26, pandas 2.1, ...) on the oldest Python and run the suite.
  lowest:
    name: lowest bounds (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install GEARS with the lowest direct dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv venv .venv-lowest
          . .venv-lowest/bin/activate
          uv pip install --resolution lowest-direct -e .
          uv pip install pytest pyarrow
          uv pip list
      - name: Tests
        run: |
          . .venv-lowest/bin/activate
          pytest

  # The wheel is what users install: build it, check what is in it, install it in a clean
  # environment and run the command.
  build:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: The wheel holds no model, notebook, test or result, and is small
        run: |
          unzip -l dist/*.whl
          if unzip -l dist/*.whl | grep -Ei "joblib|ipynb|tests/|results/"; then
            echo "::error::unwanted files in the wheel"; exit 1
          fi
          size=$(stat -c %s dist/*.whl)
          echo "wheel: $size bytes"
          test "$size" -lt 307200
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          ./venv/bin/python -c "import gears; print(gears.__version__)"
          ./venv/bin/gears --help
